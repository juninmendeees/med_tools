{% extends 'base.html' %}

{% block title %}Senha Alterada - MedTools{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-6 col-lg-5 text-center">
        <div class="card card-custom p-5 border-0 shadow-sm">
            <div class="mb-4">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
            </div>
            
            <h2 class="fw-bold">Senha Alterada!</h2>
            <p class="text-muted mt-3">
                Sua senha foi redefinida com sucesso. Agora você já pode acessar sua conta com a nova credencial.
            </p>

            <div class="mt-4">
                <a href="{% url 'account_login' %}" class="btn btn-primary rounded-pill px-5 fw-bold shadow-sm">
                    Fazer Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
