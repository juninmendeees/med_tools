{% extends 'base.html' %}
{% block title %}Recuperar Senha - MedTools{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom p-4 p-md-5 shadow-sm border-0">
            <h2 class="fw-bold text-center">Esqueceu a senha?</h2>
            <p class="text-muted text-center small mb-4">Insira seu e-mail abaixo para receber as instruções de recuperação.</p>

            <form method="POST" action="{% url 'account_reset_password' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-medium">E-mail cadastrado</label>
                    <input type="email" name="email" class="form-control rounded-pill" placeholder="medico@exemplo.com" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold py-2">Enviar Link</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'account_login' %}" class="small text-decoration-none text-info">Voltar para o Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
