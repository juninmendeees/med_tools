{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-6 col-lg-5 text-center">
        <div class="card card-custom p-5 border-0 shadow-sm">
            <i class="bi bi-send-check text-success display-1 mb-4"></i>
            <h2 class="fw-bold">E-mail enviado!</h2>
            <p class="text-muted">Se o e-mail informado estiver cadastrado, você receberá um link em instantes.</p>
            <a href="{% url 'account_login' %}" class="btn btn-outline-primary rounded-pill mt-3 px-4">Ir para Login</a>
        </div>
    </div>
</div>
{% endblock %}
