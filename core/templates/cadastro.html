{% extends 'base.html' %}

{% block title %}Cadastro - MedTools{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom p-4 p-md-5">
            <div class="text-center mb-4">
                <h2 class="fw-bold">Criar sua conta</h2>
                <p class="text-muted">Inicie sua jornada no MedTools hoje mesmo.</p>
            </div>

            <div class="d-grid gap-2 mb-4">
                <a href="#" class="btn btn-outline-dark rounded-pill d-flex align-items-center justify-content-center py-2 shadow-sm">
                    <i class="bi bi-google me-2 text-danger"></i> Cadastrar com Google
                </a>
                <a href="#" class="btn btn-outline-dark rounded-pill d-flex align-items-center justify-content-center py-2">
                    <i class="bi bi-apple me-2"></i> Cadastrar com Apple
                </a>
            </div>

            <div class="position-relative mb-4">
                <hr>
                <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small">OU</span>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-medium">Nome</label>
                        <input type="text" class="form-control rounded-pill" name="first_name" placeholder="Ex: João" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-medium">Sobrenome</label>
                        <input type="text" class="form-control rounded-pill" name="last_name" placeholder="Ex: Silva" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-medium">E-mail</label>
                        <input type="email" class="form-control rounded-pill" name="email" placeholder="medico@exemplo.com" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-medium">Telefone com DDD</label>
                        <input type="tel" class="form-control rounded-pill" name="telefone" placeholder="(11) 99999-9999" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-medium">Senha</label>
                        <input type="password" class="form-control rounded-pill" name="password" placeholder="Mínimo 8 caracteres" required>
                    </div>

                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold shadow-sm">
                            Finalizar Cadastro
                        </button>
                    </div>
                </div>
            </form>

            <div class="text-center mt-4">
                <p class="small text-muted">Já tem uma conta? <a href="{% url 'login' %}" class="text-info fw-bold text-decoration-none">Fazer Login</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
